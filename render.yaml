services:
  - type: web
    name: finvois
    runtime: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm run build:prod
    startCommand: pnpm run start:prod
    preDeployCommand: pnpm run db:push
    healthCheckPath: /api/healthz
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: finvois-db
          property: connectionString

databases:
  - name: finvois-db
    plan: basic-256mb
